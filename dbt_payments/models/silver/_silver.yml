version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_unique_id
        description: "One row per real person - proves the dedup worked."
        tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        description: "Never null - uncategorised products fall back to 'unknown'."
        tests: [not_null]

  - name: int_order_payments
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: total_paid
        description: "Total paid should never be negative."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: int_order_values
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_value
        description: "Order value should never be negative."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
